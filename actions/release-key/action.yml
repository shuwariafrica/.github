name: Release key
description: >-
  Reads C1's subkey-only export from Key Vault as the `release` environment's federated identity,
  imports it into a new GNUPGHOME and proves its primary is the published fingerprint. A later
  step that signs names that home (`env: GNUPGHOME: steps.<id>.outputs.gnupghome`); `sign` signs
  the files named, each signature naming this run's repository id and ref
  (`repository-ref@shuwari.africa`), and verifies each under gpg and sqv. The job needs
  `permissions: id-token: write` and gpg, sqv, curl and jq.
inputs:
  tenant-id:
    description: The Entra tenant.
    required: true
  client-id:
    description: The client id of the identity `release` federates to for the subkey.
    required: true
  vault-url:
    description: The subkey's vault URI.
    required: true
  fingerprint:
    description: C1's published primary fingerprint.
    required: true
  sign:
    description: Files to sign, one per line; none when the build signs through gpg itself.
    required: false
    default: ""
outputs:
  gnupghome:
    description: The GNUPGHOME holding the subkey alone.
    value: ${{ steps.import.outputs.gnupghome }}
  subkey:
    description: The signing subkey's fingerprint.
    value: ${{ steps.import.outputs.subkey }}
runs:
  using: composite
  steps:
    # Each step runs as release-take's does. The shell is the image's bash in POSIX mode, so no
    # function a caller exports (BASH_FUNC_<name>%%) can stand for `set`, `exec` or `:`. env -i
    # then hands the step's script only the variables named, and a token goes on descriptor 3,
    # never into an argument list. The variables cleared below are this step's own env, which the
    # runner merges last; each is one bash or the loader reads before this script's first line.
    - name: Import the release key
      id: import
      shell: /usr/bin/bash --posix --noprofile --norc -e -o pipefail {0}
      env:
        TENANT_ID: ${{ inputs.tenant-id }}
        CLIENT_ID: ${{ inputs.client-id }}
        VAULT_URL: ${{ inputs.vault-url }}
        FINGERPRINT: ${{ inputs.fingerprint }}
        BASH_ENV: ""
        ENV: ""
        SHELLOPTS: ""
        BASHOPTS: ""
        PS4: "+ "
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""
      run: |
        set -euo pipefail
        exec 3<<TOKEN
        ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}
        TOKEN
        exec /usr/bin/env -i PATH=/usr/bin:/bin \
          RUNNER_TEMP="${RUNNER_TEMP:?}" GITHUB_OUTPUT="${GITHUB_OUTPUT:?}" \
          ACTIONS_ID_TOKEN_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL:-}" \
          TENANT_ID="${TENANT_ID}" CLIENT_ID="${CLIENT_ID}" VAULT_URL="${VAULT_URL}" FINGERPRINT="${FINGERPRINT}" \
          /usr/bin/bash --noprofile --norc "${GITHUB_ACTION_PATH:?}/import-step.sh"
    - name: Sign
      if: inputs.sign != ''
      shell: /usr/bin/bash --posix --noprofile --norc -e -o pipefail {0}
      env:
        FILES: ${{ inputs.sign }}
        GNUPGHOME: ${{ steps.import.outputs.gnupghome }}
        SUBKEY: ${{ steps.import.outputs.subkey }}
        # This step's own env is merged last, so the calling step cannot name another run.
        REPOSITORY_REF: ${{ github.repository_id }}:${{ github.ref }}
        BASH_ENV: ""
        ENV: ""
        SHELLOPTS: ""
        BASHOPTS: ""
        PS4: "+ "
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""
      run: |
        set -euo pipefail
        exec /usr/bin/env -i PATH=/usr/bin:/bin \
          FILES="${FILES}" GNUPGHOME="${GNUPGHOME}" SUBKEY="${SUBKEY}" REPOSITORY_REF="${REPOSITORY_REF}" \
          /usr/bin/bash --noprofile --norc "${GITHUB_ACTION_PATH:?}/sign-step.sh"
