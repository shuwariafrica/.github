name: Release key
description: >-
  Reads C1's subkey-only export from Key Vault as the `release` environment's federated identity,
  imports it into a new GNUPGHOME and proves its primary is the published fingerprint. A later
  step that signs names that home (`env: GNUPGHOME: steps.<id>.outputs.gnupghome`); `sign` signs
  the files named, each signature naming this run's repository id and ref
  (`repository-ref@shuwari.africa`), and verifies each under gpg and sqv. The job needs
  `permissions: id-token: write` and gpg, sqv, curl and jq.
inputs:
  tenant-id:
    description: The Entra tenant.
    required: true
  client-id:
    description: The client id of the identity `release` federates to for the subkey.
    required: true
  vault-url:
    description: The subkey's vault URI.
    required: true
  fingerprint:
    description: C1's published primary fingerprint.
    required: true
  sign:
    description: Files to sign, one per line; none when the build signs through gpg itself.
    required: false
    default: ""
outputs:
  gnupghome:
    description: The GNUPGHOME holding the subkey alone.
    value: ${{ steps.import.outputs.gnupghome }}
  subkey:
    description: The signing subkey's fingerprint.
    value: ${{ steps.import.outputs.subkey }}
runs:
  using: composite
  steps:
    - name: Import the release key
      id: import
      shell: bash
      env:
        TENANT_ID: ${{ inputs.tenant-id }}
        CLIENT_ID: ${{ inputs.client-id }}
        VAULT_URL: ${{ inputs.vault-url }}
        FINGERPRINT: ${{ inputs.fingerprint }}
      run: |
        set -euo pipefail
        : "${RUNNER_TEMP:?}" "${GITHUB_ACTION_PATH:?}" "${GITHUB_OUTPUT:?}"
        [[ ${VAULT_URL} =~ ^https://[a-z0-9-]+\.vault\.azure\.net/?$ ]] || {
          printf '::error::not a Key Vault URI: %s\n' "${VAULT_URL}"
          exit 64
        }
        kv="${GITHUB_ACTION_PATH}/../key-vault"
        token=$(mktemp -p "${RUNNER_TEMP}")
        export_file=$(mktemp -p "${RUNNER_TEMP}")
        trap 'rm -f "${token}" "${export_file}"' EXIT
        "${kv}/token.sh" "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
          "${CLIENT_ID}" https://vault.azure.net/.default "${token}"
        "${kv}/get-secret.sh" "${VAULT_URL}" c1-subkey "${token}" "${export_file}"
        # A Key Vault value is no GitHub secret, so the runner masks nothing of it unasked: every
        # line of the export is registered before any later step runs.
        "${kv}/mask.sh" "${export_file}"
        home="${RUNNER_TEMP}/release-gnupg"
        subkey=$("${GITHUB_ACTION_PATH}/import-key.sh" "${export_file}" "${FINGERPRINT}" "${home}")
        printf 'gnupghome=%s\nsubkey=%s\n' "${home}" "${subkey}" >>"${GITHUB_OUTPUT}"
        printf 'release key: C1 %s, signing subkey %s\n' "${FINGERPRINT}" "${subkey}"
    - name: Sign
      if: inputs.sign != ''
      shell: bash
      env:
        FILES: ${{ inputs.sign }}
        GNUPGHOME: ${{ steps.import.outputs.gnupghome }}
        SUBKEY: ${{ steps.import.outputs.subkey }}
        # This step's own env is merged last, so the calling step cannot name another run.
        REPOSITORY_REF: ${{ github.repository_id }}:${{ github.ref }}
      run: |
        set -euo pipefail
        : "${GNUPGHOME:?}" "${GITHUB_ACTION_PATH:?}" "${REPOSITORY_REF:?}"
        mapfile -t files < <(printf '%s\n' "${FILES}" | sed '/^[[:space:]]*$/d')
        "${GITHUB_ACTION_PATH}/sign.sh" "${GNUPGHOME}" "${SUBKEY}" "${REPOSITORY_REF}" "${files[@]}"
