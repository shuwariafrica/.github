name: Verify release signatures
description: >-
  Verifies every <file>.asc under a directory as one signature by C1, under gpg and sqv, each naming
  the repository and ref of the run that made it. With `gnupghome` and `subkey`, the release-key
  action's outputs, against the key that home holds: a release job's proof of what it signed
  (sbt-pgp's publishSigned). Without them, against C1's certificate alone, read from this action's
  own commit of `.github` (`signing/c1-public.asc`) and merged with what keyserver.ubuntu.com and
  keys.openpgp.org publish for it: a job that holds no subkey, in `release-read` among others,
  verifies a release this way, and needs gpg, sqv and curl. Fails when the directory holds no
  signature.
inputs:
  directory:
    description: The directory holding the signed files and their signatures.
    required: true
  repository-ref:
    description: >-
      `<repository id>:<ref>` of the run every signature must name, such as
      `1312037295:refs/tags/v1.2.3`; required without `gnupghome`, and empty with it for signatures
      made without one (sbt-pgp's).
    required: false
    default: ""
  gnupghome:
    description: The release-key action's `gnupghome` output, for the home form.
    required: false
    default: ""
  subkey:
    description: The release-key action's `subkey` output, for the home form.
    required: false
    default: ""
runs:
  using: composite
  steps:
    # The step runs as release-take's does. The shell is the image's bash in POSIX mode, so no
    # function a caller exports (BASH_FUNC_<name>%%) can stand for `set`, `exec` or `:`, and env -i
    # then hands verify-step.sh only the variables named. The variables below are this step's own
    # env, which the runner merges last. Each sets aside what bash, glibc or the loader reads before
    # this script's first line; LC_ALL=C also keeps glibc from loading a character-set converter as
    # bash starts.
    - name: Verify
      shell: /usr/bin/bash --posix --noprofile --norc -e -o pipefail {0}
      env:
        RELEASE_HOME: ${{ inputs.gnupghome }}
        SUBKEY: ${{ inputs.subkey }}
        DIRECTORY: ${{ inputs.directory }}
        REPOSITORY_REF: ${{ inputs.repository-ref }}
        BASH_ENV: ""
        ENV: ""
        SHELLOPTS: ""
        BASHOPTS: ""
        PS4: "+ "
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""
        GCONV_PATH: ""
        LC_ALL: C
        BASH_COMPAT: ""
      run: |
        set -euo pipefail
        exec /usr/bin/env -i PATH=/usr/bin:/bin RUNNER_TEMP="${RUNNER_TEMP:?}" \
          RELEASE_HOME="${RELEASE_HOME}" SUBKEY="${SUBKEY}" DIRECTORY="${DIRECTORY}" REPOSITORY_REF="${REPOSITORY_REF}" \
          /usr/bin/bash --noprofile --norc "${GITHUB_ACTION_PATH:?}/../verify-step.sh"
