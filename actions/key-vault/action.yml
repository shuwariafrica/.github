name: Key Vault secret
description: >-
  Reads, writes or checks the absence of one Azure Key Vault secret, or hands a tool the vault
  access token, as the identity the job's environment federates to. The job needs
  `permissions: id-token: write`; no credential is stored.
inputs:
  operation:
    description: >-
      `get` (the value into `file`), `set` (`file` as a new version), `absent` (fails when the
      secret exists) or `token` (the access token into `file`, for a tool that calls the vault
      itself, as jsign does).
    required: true
  tenant-id:
    description: The Entra tenant.
    required: true
  client-id:
    description: The federated identity's client id.
    required: true
  vault-url:
    description: The vault's URI, e.g. https://shuwari-release-signing.vault.azure.net.
    required: true
  secret:
    description: The secret's name; unused by `token`.
    required: false
    default: ""
  file:
    description: The file read for `set`, or written, mode 600, for `get` and `token`.
    required: false
    default: ""
runs:
  using: composite
  steps:
    # The shell is the image's bash in POSIX mode, so no function a caller exports
    # (BASH_FUNC_<name>%%) can stand for `set`, `exec` or `:`. env -i then hands the step's script
    # only the variables named, and the OIDC request token goes on descriptor 3, never into an
    # argument list. The variables below are this step's own env, which the runner merges last. Each
    # sets aside what bash, glibc or the loader reads before this script's first line; LC_ALL=C also
    # keeps glibc from loading a character-set converter as bash starts.
    - name: Key Vault secret
      shell: /usr/bin/bash --posix --noprofile --norc -e -o pipefail {0}
      env:
        OPERATION: ${{ inputs.operation }}
        TENANT_ID: ${{ inputs.tenant-id }}
        CLIENT_ID: ${{ inputs.client-id }}
        VAULT_URL: ${{ inputs.vault-url }}
        SECRET: ${{ inputs.secret }}
        FILE: ${{ inputs.file }}
        BASH_ENV: ""
        ENV: ""
        SHELLOPTS: ""
        BASHOPTS: ""
        PS4: "+ "
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""
        GCONV_PATH: ""
        LC_ALL: C
        BASH_COMPAT: ""
      run: |
        set -euo pipefail
        exec 3<<TOKEN
        ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}
        TOKEN
        exec /usr/bin/env -i PATH=/usr/bin:/bin RUNNER_TEMP="${RUNNER_TEMP:?}" \
          ACTIONS_ID_TOKEN_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL:-}" \
          OPERATION="${OPERATION}" TENANT_ID="${TENANT_ID}" CLIENT_ID="${CLIENT_ID}" VAULT_URL="${VAULT_URL}" \
          SECRET="${SECRET}" FILE="${FILE}" \
          /usr/bin/bash --noprofile --norc "${GITHUB_ACTION_PATH:?}/key-vault.sh"
