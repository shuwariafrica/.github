name: Sign a crate release
description: >-
  Signs a public crate's SHA256SUMS with the project's own key, in its release job behind the
  release gate. First it reads release.yml at this run's commit through the API, as data, and
  refuses unless every action there is a shuwariafrica/.github action at this action's own commit,
  a shuwariafrica/public-crates action at public-crates' gate-commit, or an action on this commit's
  actions/third-party.tsv at a commit listed for it, so every job before it ran code the
  organisation fixed; and it holds SHA256SUMS to crate-package's digest. Then, through release-key's
  scripts at this same commit, it reads the secret `subkey` of the project's vault as the
  environment's federated identity, every line masked, imports it into a new GnuPG home, proves its
  primary is projects.json's signing_key at public-crates' main, refuses a primary or subkey that
  keys.openpgp.org or keyserver.ubuntu.com publishes as revoked (a keyserver that does not answer
  refuses too), signs SHA256SUMS and verifies the signature under gpg and sqv, which it installs
  from Ubuntu's package held to its SHA-256. The home is removed when the action ends, however it
  ends. The job needs `permissions: id-token: write` and `contents: read`.
inputs:
  tenant-id:
    description: The Entra tenant.
    required: true
  client-id:
    description: The client id of the project's own signing identity, which `release` federates to.
    required: true
  vault-url:
    description: The URI of the project's own vault, whose secret `subkey` is its signing subkey.
    required: true
  directory:
    description: The directory holding crate-package's files, downloaded by its artefact's id.
    required: true
  digest:
    description: crate-package's `digest` output.
    required: true
outputs:
  signature:
    description: SHA256SUMS.asc, for the job to upload.
    value: ${{ inputs.directory }}/SHA256SUMS.asc
runs:
  using: composite
  steps:
    # Each step runs as release-key's do. The shell is the image's bash in POSIX mode, so no
    # function a caller exports (BASH_FUNC_<name>%%) can stand for `set`, `exec` or `:`; env -i
    # then hands the script only the variables named, and a token goes on descriptor 3, never into
    # an argument list. Every value is the step's own env, which the runner merges last. Each of
    # the last eleven sets aside what bash, glibc or the loader reads before the script's first
    # line; LC_ALL=C also keeps glibc from loading a character-set converter as bash starts.
    - name: The run's pins and package's files
      id: check
      shell: /usr/bin/bash --posix --noprofile --norc -e -o pipefail {0}
      env:
        TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        REPOSITORY_ID: ${{ github.repository_id }}
        REF: ${{ github.ref }}
        SHA: ${{ github.sha }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        DIRECTORY: ${{ inputs.directory }}
        DIGEST: ${{ inputs.digest }}
        API: https://api.github.com
        GIT_BASE: https://github.com
        BASH_ENV: ""
        ENV: ""
        SHELLOPTS: ""
        BASHOPTS: ""
        PS4: "+ "
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""
        GCONV_PATH: ""
        LC_ALL: C
        BASH_COMPAT: ""
      run: |
        set -euo pipefail
        exec 3<<TOKEN
        ${TOKEN}
        TOKEN
        exec /usr/bin/env -i PATH=/usr/bin:/bin \
          RUNNER_TEMP="${RUNNER_TEMP:?}" GITHUB_OUTPUT="${GITHUB_OUTPUT:?}" GITHUB_ACTION_PATH="${GITHUB_ACTION_PATH:?}" \
          REPOSITORY="${REPOSITORY}" REPOSITORY_ID="${REPOSITORY_ID}" REF="${REF}" SHA="${SHA}" \
          WORKFLOW_REF="${WORKFLOW_REF}" DIRECTORY="${DIRECTORY}" DIGEST="${DIGEST}" API="${API}" GIT_BASE="${GIT_BASE}" \
          /usr/bin/bash --noprofile --norc "${GITHUB_ACTION_PATH}/check-step.sh"
    - name: sqv, from Ubuntu's package
      shell: /usr/bin/bash --posix --noprofile --norc -e -o pipefail {0}
      env:
        # sqv 1.3.0-3ubuntu1 from Ubuntu 26.04's release pocket, the digests its signed index
        # states, as release-take installs it.
        SQV_URL: ${{ runner.arch == 'ARM64' && 'https://ports.ubuntu.com/ubuntu-ports/pool/universe/r/rust-sequoia-sqv/sqv_1.3.0-3ubuntu1_arm64.deb' || 'https://archive.ubuntu.com/ubuntu/pool/universe/r/rust-sequoia-sqv/sqv_1.3.0-3ubuntu1_amd64.deb' }}
        SQV_SHA256: ${{ runner.arch == 'ARM64' && 'ceeb9c86e301da08fa805279b2822bd146999b227fd1bdda3eae5a4fa32ade23' || '540dab7561a18b799739f4f09da8777ad36bb04160827260765067e520b39d97' }}
        BASH_ENV: ""
        ENV: ""
        SHELLOPTS: ""
        BASHOPTS: ""
        PS4: "+ "
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""
        GCONV_PATH: ""
        LC_ALL: C
        BASH_COMPAT: ""
      run: |
        set -euo pipefail
        exec /usr/bin/env -i PATH=/usr/bin:/bin \
          /usr/bin/bash --noprofile --norc "${GITHUB_ACTION_PATH:?}/sqv.sh" \
          "${RUNNER_TEMP:?}/crate-sign-sqv" "${SQV_URL}" "${SQV_SHA256}" /usr/bin/sqv
    - name: Import the project's key
      id: import
      shell: /usr/bin/bash --posix --noprofile --norc -e -o pipefail {0}
      env:
        TENANT_ID: ${{ inputs.tenant-id }}
        CLIENT_ID: ${{ inputs.client-id }}
        VAULT_URL: ${{ inputs.vault-url }}
        FINGERPRINT: ${{ steps.check.outputs.fingerprint }}
        SECRET: subkey
        BASH_ENV: ""
        ENV: ""
        SHELLOPTS: ""
        BASHOPTS: ""
        PS4: "+ "
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""
        GCONV_PATH: ""
        LC_ALL: C
        BASH_COMPAT: ""
      run: |
        set -euo pipefail
        exec 3<<TOKEN
        ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}
        TOKEN
        exec /usr/bin/env -i PATH=/usr/bin:/bin \
          RUNNER_TEMP="${RUNNER_TEMP:?}" GITHUB_OUTPUT="${GITHUB_OUTPUT:?}" \
          ACTIONS_ID_TOKEN_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL:-}" \
          TENANT_ID="${TENANT_ID}" CLIENT_ID="${CLIENT_ID}" VAULT_URL="${VAULT_URL}" FINGERPRINT="${FINGERPRINT}" \
          SECRET="${SECRET}" \
          /usr/bin/bash --noprofile --norc "${GITHUB_ACTION_PATH:?}/../release-key/import-step.sh"
    - name: The subkey is not revoked
      shell: /usr/bin/bash --posix --noprofile --norc -e -o pipefail {0}
      env:
        SUBKEY: ${{ steps.import.outputs.subkey }}
        REVOKED: ${{ steps.check.outputs.revoked }}
        BASH_ENV: ""
        ENV: ""
        SHELLOPTS: ""
        BASHOPTS: ""
        PS4: "+ "
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""
        GCONV_PATH: ""
        LC_ALL: C
        BASH_COMPAT: ""
      run: |
        set -euo pipefail
        exec /usr/bin/env -i PATH=/usr/bin:/bin SUBKEY="${SUBKEY}" REVOKED="${REVOKED}" \
          /usr/bin/bash --noprofile --norc "${GITHUB_ACTION_PATH:?}/standing.sh"
    - name: Sign SHA256SUMS
      shell: /usr/bin/bash --posix --noprofile --norc -e -o pipefail {0}
      env:
        FILES: ${{ inputs.directory }}/SHA256SUMS
        GNUPGHOME: ${{ steps.import.outputs.gnupghome }}
        SUBKEY: ${{ steps.import.outputs.subkey }}
        REPOSITORY_REF: ${{ github.repository_id }}:${{ github.ref }}
        BASH_ENV: ""
        ENV: ""
        SHELLOPTS: ""
        BASHOPTS: ""
        PS4: "+ "
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""
        GCONV_PATH: ""
        LC_ALL: C
        BASH_COMPAT: ""
      run: |
        set -euo pipefail
        exec /usr/bin/env -i PATH=/usr/bin:/bin \
          FILES="${FILES}" GNUPGHOME="${GNUPGHOME}" SUBKEY="${SUBKEY}" REPOSITORY_REF="${REPOSITORY_REF}" \
          /usr/bin/bash --noprofile --norc "${GITHUB_ACTION_PATH:?}/../release-key/sign-step.sh"
    - name: Remove the key
      if: always()
      shell: /usr/bin/bash --posix --noprofile --norc -e -o pipefail {0}
      env:
        BASH_ENV: ""
        ENV: ""
        SHELLOPTS: ""
        BASHOPTS: ""
        PS4: "+ "
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""
        GCONV_PATH: ""
        LC_ALL: C
        BASH_COMPAT: ""
      run: |
        set -euo pipefail
        exec /usr/bin/env -i PATH=/usr/bin:/bin RUNNER_TEMP="${RUNNER_TEMP:?}" \
          /usr/bin/bash --noprofile --norc "${GITHUB_ACTION_PATH:?}/remove.sh"
