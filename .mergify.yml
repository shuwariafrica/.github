merge_queue:
  mode: isolated
  max_parallel_checks: 2

queue_rules:
  - name: dependencies
    # Empty by design: branch_protection_injection_mode (default "queue")
    # injects each repo's required checks automatically.
    queue_conditions: []
    merge_conditions: []

pull_request_rules:
  - name: Queue Dependency Updates (Dependabot + Renovate + Scala Steward)
    conditions:
      - or: &bot-authors
          - author = dependabot[bot]
          - author = renovate[bot]
          - author = shuwari-dev
    actions:
      queue:
        name: dependencies

  # breaking is additive: stacks on top of the ladder below, not a rung in it.
  - name: Label breaking changes
    conditions:
      - 'commits[*].commit_message ~= (?i)\[(breaking|major)\]'
    actions:
      label:
        add:
          - breaking

  # Highest-wins ladder: feature > fix > task > dependencies. Each rule
  # negates every higher-ranked pattern, so at most one holds at a time.
  # toggle, not add: a label here is removed once its condition stops
  # holding, including one added by hand.
  - name: Label features
    conditions:
      - 'commits[*].commit_message ~= (?i)\[(feat|feature|minor)\]'
    actions:
      label:
        toggle:
          - feature

  - name: Label fixes
    conditions:
      - 'commits[*].commit_message ~= (?i)\[fix\]'
      - '-commits[*].commit_message ~= (?i)\[(feat|feature|minor)\]'
    actions:
      label:
        toggle:
          - defect

  - name: Label maintenance
    conditions:
      - 'commits[*].commit_message ~= (?i)\[task\]'
      - '-commits[*].commit_message ~= (?i)\[(feat|feature|minor)\]'
      - '-commits[*].commit_message ~= (?i)\[fix\]'
    actions:
      label:
        toggle:
          - task

  # Author is an alternate trigger: bot commits don't reliably carry a
  # [dependencies] tag.
  - name: Label dependencies
    conditions:
      - or:
          - 'commits[*].commit_message ~= (?i)\[dependencies\]'
          - or: *bot-authors
      - '-commits[*].commit_message ~= (?i)\[(feat|feature|minor)\]'
      - '-commits[*].commit_message ~= (?i)\[fix\]'
      - '-commits[*].commit_message ~= (?i)\[task\]'
    actions:
      label:
        toggle:
          - dependencies

  # Not a ladder rung: layers alongside whichever label above wins.
  - name: Label GitHub Actions updates
    conditions:
      - 'files ~= ^\.github/workflows/'
    actions:
      label:
        toggle:
          - github_actions
